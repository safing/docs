# to start the server just run
# docker-compose up

version: '3'
services:
  jekyll:
    image: safing-docs-jekyll:local
    build:
      context: .
      dockerfile: Dockerfile
    command: bundle exec jekyll serve -H 0.0.0.0 -P 3000 --watch --incremental --livereload
    ports:
      - 3000:3000
      - 35729:35729
    volumes:
      - .:/srv/jekyll
